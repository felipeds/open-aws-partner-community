name: Two-key cross-company review

# Enforces §7.3: a PR touching a working-group folder needs TWO approving reviews
# from members of TWO DIFFERENT partner companies. CODEOWNERS guarantees a code
# owner approves, but it cannot check that approvers come from different partner
# teams — this required check does.
#
# ── SETUP REQUIRED BEFORE THIS CAN PASS ──────────────────────────────────────
# This check needs to map each approver to a partner company. That mapping does
# not exist until the org and per-partner GitHub teams are created (tooling
# proposal item 5: "every contributor belongs to exactly one partner team").
#
# Populate PARTNER_TEAMS below with the real "<org>/<team>" slugs once they exist,
# and grant the workflow a token with `read:org`. Until then this job intentionally
# fails closed so it is not mistaken for a passing guarantee.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cross-company:
    runs-on: ubuntu-latest
    steps:
      - name: Check two approvals from two different partner companies
        env:
          # e.g. PARTNER_TEAMS: "my-org/cit my-org/brq my-org/accenture my-org/darede"
          PARTNER_TEAMS: ""
        run: |
          set -euo pipefail
          if [ -z "${PARTNER_TEAMS}" ]; then
            echo "::error::Partner-team mapping not configured yet. Create the org and"
            echo "::error::per-partner teams, then set PARTNER_TEAMS. Failing closed (§7.3)."
            exit 1
          fi
          echo "TODO: resolve each approver's partner team via the GitHub API and require"
          echo "two APPROVED reviews from two DIFFERENT teams in PARTNER_TEAMS."
          exit 1
